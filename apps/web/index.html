<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ iconUrl }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeWe RSS</title>
    <meta name="description" content="更好的公众号订阅方式" />
    <!-- Use the existing system font stack without waiting for external fonts. -->
  </head>
  <body>
    {{#if acceptanceMode}}
    <aside
      role="status"
      style="
        padding: 12px 20px;
        background: #fff3cd;
        color: #533f03;
        border-bottom: 1px solid #e8cf84;
      "
    >
      <strong>隔离测试，尚未恢复正式订阅</strong> · 运行版本 {{
      acceptanceVersion }}<br />
      此页面处于隔离验收模式；测试状态不代表正式订阅或来源采集已完成。<br />
      {{ acceptanceSearchNote }}
    </aside>
    {{/if}}
    <div id="root"></div>
    <script>
      window.__WEWE_RSS_SERVER_ORIGIN_URL__ = '{{ weweRssServerOriginUrl }}';
      window.__WEWE_RSS_ENABLED_AUTH_CODE__ = '{{ enabledAuthCode }}';
      window.__WEWE_RSS_PRIVATE_ONLINE_MODE__ = '{{ privateOnlineMode }}';
      window.__WEWE_RSS_ACCEPTANCE_MODE__ = '{{ acceptanceMode }}';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
