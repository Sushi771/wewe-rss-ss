name: Article history preservation

on:
  pull_request:
    paths:
      - 'apps/server/scripts/article_history.py'
      - 'apps/server/scripts/article-history-browser.cjs'
      - 'apps/server/scripts/test-article-history-browser.cjs'
      - 'apps/server/scripts/test_article_history.py'
      - 'apps/server/scripts/article_history_host.py'
      - 'apps/server/scripts/test_article_history_host.py'
      - 'apps/server/scripts/article-history-runtime.cjs'
      - 'apps/server/scripts/test-article-history-runtime.cjs'
      - 'apps/server/scripts/article-history-resources.ps1'
      - 'apps/server/scripts/sqlite-snapshot-guard.py'
      - 'apps/server/src/collection/sqlite-snapshot-guard.ts'
      - 'apps/server/src/collection/sqlite-backup-reuse.ts'
      - 'docs/ARTICLE_HISTORY_PRESERVATION.md'
      - '.github/workflows/article-history.yml'
      - 'scripts/local-release/build.cjs'
  push:
    branches:
      - 'codex/article-history-preservation-*'
      - 'codex/backend-recovery-integration-20261014'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-preservation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      ARTICLE_HISTORY_SYNTHETIC_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install the actual coordinator dependency graph
        run: pnpm install --frozen-lockfile
      - name: Synthetic coverage and real offline browser decoding
        working-directory: apps/server/scripts
        env:
          ARTICLE_HISTORY_BROWSER_REQUIRED: '1'
          ARTICLE_HISTORY_DIAGNOSTICS_DIR: ${{ runner.temp }}/article-history-diagnostics
        run: python -m unittest test_article_history test_article_history_host test_sqlite_snapshot_guard -v
      - name: Actual Node coordinator and owner stdio integration
        env:
          ARTICLE_HISTORY_DIAGNOSTICS_DIR: ${{ runner.temp }}/article-history-diagnostics
        run: node --experimental-transform-types --test apps/server/scripts/test-article-history-runtime.cjs
      - name: Bounded startup faults and six consecutive real offline browser runs
        env:
          ARTICLE_HISTORY_BROWSER_REQUIRED: '1'
          ARTICLE_HISTORY_DIAGNOSTICS_DIR: ${{ runner.temp }}/article-history-diagnostics
        run: node --test apps/server/scripts/test-article-history-browser.cjs
      - name: Browser syntax
        run: node --check apps/server/scripts/article-history-browser.cjs
      - name: Typecheck actual maintenance integration
        run: pnpm --filter server exec tsc --noEmit --incremental false -p tsconfig.build.json
      - name: Retain bounded synthetic browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: article-history-synthetic-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/article-history-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 3
