name: XHS subscription offline

on:
  push:
    branches: [codex/xhs-subscription-integration, codex/xhs-depth-integration, feat/xhs-engagement, codex/xhs-receipt-link, codex/xhs-unified-integration]
  pull_request:
    branches: [fix/desktop-docker-cold-start, codex/xhs-depth-integration]

permissions:
  contents: read

jobs:
  focused-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DATABASE_URL: 'file:./ci-placeholder.sqlite'
      XHS_SUBSCRIPTION_LIVE_ENABLED: '0'
      XHS_COMMENT_COLLECTION_ENABLED: '0'
      XHS_TEST_PYTHON: python
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact backup coverage exception (memory only)
        run: python -m unittest discover -s apps/server/scripts -p test_snapshot_covers.py
      - name: Indexed read-only retirement evidence
        run: python -m unittest discover -s apps/server/scripts -p test_indexed_retirement.py
      - name: Exact retirement adapter (owned Windows fixtures only)
        run: python -m unittest discover -s apps/server/scripts -p test_fixed_retirement_executor.py -v
      - name: Install independent synthetic image decoder (test only)
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --index-url https://pypi.org/simple 'Pillow==12.1.1'
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Privacy inventory and protected package regressions
        run: |
          node --test scripts/local-release/private-inventory.test.cjs scripts/local-release/private-artifact-proof.test.cjs
          node --test --test-name-pattern='^(v3|a v3)' scripts/local-release/release-scope.test.cjs
      - name: Preserving update effects and process transitions
        run: |
          node --test scripts/local-release/preserving-contract.test.cjs scripts/local-release/preserving-restart.test.cjs
          node --test --test-name-pattern='^(preserving|original complete)' scripts/local-release/release-scope.test.cjs scripts/local-release/install-lifecycle.test.cjs scripts/local-release/windows-release-references.test.cjs
      - run: pnpm install --frozen-lockfile
      - name: Synthetic source, session, storage and shared grouping regressions
        run: pnpm --filter server exec jest --runInBand --testPathPattern='(collection/(xhs-|xiaohongshu|subscription-video|media-transaction|saved-media-writeback)|trpc/(xiaohongshu-ui|management-groups)|platform-export-target|article-folder-picker|xhs-cached-local-export|article-local-save|xhs-single-download|xhs-video-download|article-verified-download|feeds/(automatic-media-queue|automatic-media-storage)|media-large-export)'
      - name: Shared UI and WeChat regressions
        run: node --test scripts/xhs-original-link-privacy.test.cjs scripts/xhs-original-link-ui.test.cjs scripts/xhs-source-budget-ui.test.cjs scripts/xhs-rejection-messages.test.cjs scripts/xhs-note-links.test.cjs scripts/xhs-engagement-visibility.test.cjs scripts/sites-local-contract.test.mjs scripts/xhs-reader-removal.test.cjs scripts/xhs-whole-creator-ui.test.cjs scripts/xhs-subscription-ui.test.cjs scripts/xhs-task-recovery-ui.test.cjs scripts/storage-status-ui.test.cjs scripts/manual-refresh-progress-ui.test.cjs scripts/xhs-batch-subscription-ui.test.cjs scripts/xhs-combined-filter.test.cjs scripts/xhs-metric-sort.test.cjs scripts/feed-reading-ui.test.cjs scripts/feed-export-date-ui.test.cjs scripts/folder-navigation-ui.test.cjs scripts/article-date-shortcuts.test.cjs scripts/xiaohongshu-refresh-ui.test.cjs scripts/folder-member-picker.test.cjs scripts/deployed-export-adaptation.test.cjs scripts/feed-refresh-state-ui.test.cjs scripts/article-body-state.test.cjs scripts/feed-browse-state.test.cjs scripts/wechat-original-link.test.cjs scripts/feed-avatar-reading-ui.test.cjs scripts/wechat-source-metrics-ui.test.cjs scripts/export-article-batches.test.cjs scripts/export-interruption-ui.test.cjs
      - name: Existing maintenance status contract
        run: pnpm --filter server exec jest --runInBand --testPathPattern=startup-audit.spec --testNamePattern='existing status read'
      - name: Types
        run: |
          pnpm --filter server exec tsc --noEmit
          pnpm --filter web exec tsc --noEmit
      - name: Focused web lint and build
        run: |
          pnpm --filter web exec eslint src/pages/feeds/xiaohongshu.tsx src/components/XhsBatchSubscription.tsx src/utils/xhs-subscription-batch.ts src/provider/trpc.tsx src/components/XhsCombinedFilter.tsx src/utils/xhs-combined-filter.ts src/components/XhsCreatorAvatar.tsx src/utils/xhs-metric-sort.ts src/components/XhsWholeCreator.tsx src/components/XhsEngagement.tsx src/components/SubscriptionPrimitives.tsx src/components/XhsTaskRecovery.tsx src/components/StorageBackupStatus.tsx src/utils/startup-status.ts src/pages/feeds/index.tsx src/pages/feeds/list.tsx src/pages/feeds/manual-refresh-progress.tsx src/provider/trpc.tsx src/utils/xiaohongshu-subscription.ts src/utils/xhs-note-presentation.ts src/utils/operation-message.ts
          pnpm --filter web build
          pnpm --filter server build
