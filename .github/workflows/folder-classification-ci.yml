name: Folder classification and current status

on:
  pull_request:
    branches:
      [
        main,
        codex/manual-refresh-download-integration,
        codex/backend-recovery-integration-20261014,
      ]
    paths:
      - 'apps/web/src/components/FolderMemberPicker.tsx'
      - 'apps/web/src/components/ManagementFolders.tsx'
      - 'apps/web/src/pages/feeds/index.tsx'
      - 'apps/web/src/utils/use-feed-browse-state.ts'
      - 'apps/web/src/pages/feeds/cache-sync-status.tsx'
      - 'apps/server/src/trpc/management-groups.spec.ts'
      - 'apps/server/src/trpc/xiaohongshu-ui.spec.ts'
      - 'scripts/folder-*.test.cjs'
      - 'scripts/cache-status-switch-browser.test.cjs'
      - 'scripts/offline-browser-fixture.cjs'
      - '.github/workflows/folder-classification-ci.yml'
  push:
    branches:
      [
        codex/folder-batch-add-fix,
        codex/backend-recovery-integration-20261014,
        codex/folder-selection-overlay-fix,
      ]

permissions:
  contents: read

jobs:
  classification-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check classification formatting and types
        run: |
          pnpm exec prettier --check apps/web/src/components/ManagementFolders.tsx apps/web/src/components/FolderMemberPicker.tsx apps/web/src/pages/feeds/index.tsx apps/server/src/trpc/management-groups.spec.ts scripts/folder-move-ui.test.cjs scripts/folder-member-picker.test.cjs scripts/folder-subscriptions-browser.test.cjs scripts/cache-status-switch-browser.test.cjs scripts/offline-browser-fixture.cjs docs/FOLDER_CLASSIFICATION.md docs/CURRENT_SUBSCRIPTION_STATUS.md .github/workflows/folder-classification-ci.yml
          pnpm --filter web exec eslint src/components/ManagementFolders.tsx src/components/FolderMemberPicker.tsx src/pages/feeds/index.tsx --max-warnings 0
          pnpm --filter web build
      - name: Test actual classification callbacks and selection offline
        run: node --test scripts/folder-navigation-ui.test.cjs scripts/folder-member-picker.test.cjs scripts/folder-move-ui.test.cjs scripts/folder-reorder-ui.test.cjs scripts/feed-group-drag-ui.test.cjs scripts/cache-sync-status-ui.test.cjs scripts/feed-refresh-state-ui.test.cjs
      - name: Test transactions and fresh-client persistence on synthetic SQLite
        run: pnpm --filter server exec jest --runInBand src/trpc/management-groups.spec.ts src/trpc/xiaohongshu-ui.spec.ts
      - name: Require installed headless Chrome
        run: test -x /usr/bin/google-chrome
      - name: Test native folder drop, multi-add and React reconciliation offline
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test scripts/folder-subscriptions-browser.test.cjs scripts/folder-reorder-browser.test.cjs scripts/cache-status-switch-browser.test.cjs scripts/folder-selection-overlay-browser.test.cjs
