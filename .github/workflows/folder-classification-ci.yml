name: Folder classification and current status

on:
  pull_request:
    branches:
      [
        main,
        codex/daily-saved-media-combined,
        codex/manual-refresh-download-integration,
        codex/backend-recovery-integration-20261014,
        codex/space-guard-review-base-20261014,
        codex/receipt-retention-integration-20261017,
        codex/terminal-refresh-integration-20261017,
      ]
    paths:
      - 'apps/web/src/components/FolderMemberPicker.tsx'
      - 'apps/web/src/components/ManagementFolders.tsx'
      - 'apps/web/src/pages/feeds/index.tsx'
      - 'apps/web/src/pages/feeds/list.tsx'
      - 'apps/web/src/provider/trpc.tsx'
      - 'apps/server/src/article-list-page.ts'
      - 'apps/server/src/article-list-page.spec.ts'
      - 'apps/server/src/article-list-cache.ts'
      - 'apps/server/src/article-list-read-timing.ts'
      - 'apps/server/src/article-list-read-timing.spec.ts'
      - 'apps/server/src/prisma/prisma.service.ts'
      - 'scripts/article-list-*.test.cjs'
      - 'apps/web/src/pages/feeds/xiaohongshu.tsx'
      - 'apps/server/src/collection/xiaohongshu.service.ts'
      - 'apps/server/src/collection/incremental-write.ts'
      - 'apps/web/src/utils/use-feed-browse-state.ts'
      - 'apps/web/src/pages/feeds/cache-sync-status.tsx'
      - 'apps/server/src/trpc/management-groups.spec.ts'
      - 'apps/server/src/trpc/xiaohongshu-ui.spec.ts'
      - 'scripts/folder-*.test.cjs'
      - 'scripts/cache-status-switch-browser.test.cjs'
      - 'scripts/offline-browser-fixture.cjs'
      - 'scripts/offline-browser-fixture.test.cjs'
      - '.github/workflows/folder-classification-ci.yml'
  push:
    branches:
      [
        codex/folder-batch-add-fix,
        codex/automatic-wechat-media-repair-20261018,
        codex/backend-recovery-integration-20261014,
        codex/folder-selection-overlay-fix,
        codex/performance-five-candidate-20261014,
      ]

permissions:
  contents: read

jobs:
  classification-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check classification formatting and types
        run: |
          pnpm exec prettier --check apps/web/src/components/ManagementFolders.tsx apps/web/src/components/FolderMemberPicker.tsx apps/web/src/pages/feeds/index.tsx apps/server/src/trpc/management-groups.spec.ts scripts/folder-move-ui.test.cjs scripts/folder-member-picker.test.cjs scripts/folder-subscriptions-browser.test.cjs scripts/cache-status-switch-browser.test.cjs scripts/offline-browser-fixture.cjs docs/FOLDER_CLASSIFICATION.md docs/CURRENT_SUBSCRIPTION_STATUS.md .github/workflows/folder-classification-ci.yml
          pnpm --filter web exec eslint src/components/ManagementFolders.tsx src/components/FolderMemberPicker.tsx src/pages/feeds/index.tsx --max-warnings 0
          pnpm --filter web build
      - name: Test actual classification callbacks and selection offline
        run: node --test scripts/folder-navigation-ui.test.cjs scripts/folder-member-picker.test.cjs scripts/folder-move-ui.test.cjs scripts/folder-reorder-ui.test.cjs scripts/folder-rename-ui.test.cjs scripts/feed-group-drag-ui.test.cjs scripts/cache-sync-status-ui.test.cjs scripts/feed-refresh-state-ui.test.cjs
      - name: Test transactions and fresh-client persistence on synthetic SQLite
        run: pnpm --filter server exec jest --runInBand src/trpc/management-groups.spec.ts src/trpc/xiaohongshu-ui.spec.ts
      - name: Require installed headless Chrome
        run: test -x /usr/bin/google-chrome
      - name: Test native folder drop, multi-add and React reconciliation offline
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 scripts/offline-browser-fixture.test.cjs scripts/folder-subscriptions-browser.test.cjs scripts/folder-reorder-browser.test.cjs scripts/cache-status-switch-browser.test.cjs scripts/folder-selection-overlay-browser.test.cjs
      - name: Test rename UI and durable commit separately through local HTTP
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
          RENAME_BENCHMARK_FULL_PAGE: 'true'
          RENAME_BENCHMARK_SAMPLES: '12'
        run: node --test scripts/folder-rename-browser.test.cjs
      - name: Test automatic media retry and pause diagnostics locally
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test scripts/automatic-media-status-browser.test.cjs
      - name: Compare uncached article pages and full pagination on synthetic SQLite
        run: node --test scripts/article-list-performance.test.cjs
      - name: Test independent article HTTP pages, restore, filters and visible errors
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
          ARTICLE_LIST_BROWSER_SAMPLES: '3'
        run: node --test scripts/article-list-browser.test.cjs
