name: Redbook readonly subset offline
on:
  pull_request:
    branches: [main, codex/manual-refresh-download-integration]
    paths:
      - 'apps/server/src/collection/redbook*'
      - 'apps/server/src/collection/redbook-vendor/**'
      - '.github/workflows/redbook-offline.yml'
      - 'scripts/redbook-local-confirmation/**'
      - 'scripts/redbook-first-check-ui.test.cjs'
      - 'apps/web/src/components/RedbookFirstCheck.tsx'
      - 'apps/web/src/utils/redbook-first-check.ts'
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.16.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate existing Prisma types without opening a database
        run: pnpm --filter server exec prisma generate
      - name: Synthetic readonly client, media and durable scan tests (no platform)
        run: pnpm --filter server exec jest --testPathPattern='collection/redbook.*\.spec\.ts$' --runInBand
      - name: Test local Redbook startup handshake and confirmation gateway offline
        working-directory: scripts/redbook-local-confirmation
        run: node --test redbook-startup.test.cjs redbook-pair-gateway.test.cjs

      - name: Test Redbook first check UI with synthetic responses
        run: node --test scripts/redbook-first-check-ui.test.cjs
