name: CI

on:
  push:
    branches:
      [
        main,
        codex/sqlite-backup-bounded-20261014,
        codex/sqlite-backup-child-exit-20261014,
        codex/sqlite-backup-production-base-20261014,
        codex/sqlite-backup-slow-copy-20261014,
        codex/article-list-read-timeout-20261014,
        codex/backend-recovery-integration-20261014,
        codex/folder-selection-overlay-fix,
        codex/cache-sync-single-preflight-20261014,
      ]
  pull_request:
    branches:
      [
        main,
        codex/manual-refresh-download-integration,
        codex/cold-launch-profile,
        codex/automatic-refresh-recovery-20261013,
        codex/body-cache-retry-status,
        codex/backend-recovery-integration-20261014,
      ]

jobs:
  windows-process-identity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native loopback listener ownership and guarded stop
        run: node --test scripts/local-release/process-identity.test.cjs scripts/local-release/identity-tool.test.cjs scripts/local-release/launch.test.cjs
      - name: Test desktop feedback and Windows state-file contention offline
        run: node --test scripts/local-release/desktop-dependencies.test.cjs scripts/local-release/desktop-progress.test.cjs scripts/local-release/desktop-home-entry.test.cjs
      - name: Test synthetic readiness with Fetch-compatible Windows ports
        run: node --test scripts/local-release/readiness.test.cjs
      - name: Test explicit Wechat2RSS binding on owned SQLite copies
        run: node --test scripts/prepare-wechat2rss-test.test.cjs
      - name: Test atomic saved-media CAS with real SQLite
        run: node --test scripts/saved-media-cas.test.cjs
      - name: Test article layout repair and original-file preservation on Windows
        run: node --test scripts/repair-article-layout.test.cjs

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm fmt.check

      - name: Lint Server
        run: pnpm --filter server lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Type check Web
        run: pnpm --filter web build
      - name: Test account modal eligibility and viewport CSS contract (no UI or HTTP)
        run: node --test scripts/check-account-modal-logic.test.cjs
      - name: Test account expiry and explicit QR recovery offline
        run: node --test scripts/account-login-ui.test.cjs scripts/wechat2rss-login-ui.test.cjs
      - name: Test Wechat2RSS source-specific metric visibility offline
        run: node --test scripts/wechat-source-metrics-ui.test.cjs
      - name: Test compact reading toolbar and collapsed diagnostics offline
        run: node --test scripts/feed-reading-ui.test.cjs scripts/feed-export-date-ui.test.cjs
      - name: Test current article cache and retry history offline
        run: node --test scripts/article-body-state.test.cjs
      - name: Test Shanghai date shortcuts and isolated reader find offline
        env:
          NODE_OPTIONS: --experimental-websocket
        run: node --test scripts/article-date-shortcuts.test.cjs scripts/feed-browse-state.test.cjs scripts/article-date-shortcuts-browser.test.cjs scripts/article-reader-find.test.cjs
      - name: Test feed sidebar scroll and compact navigation layout offline
        run: node --test scripts/feed-sidebar-layout.test.cjs scripts/folder-navigation-ui.test.cjs scripts/feed-group-drag-ui.test.cjs
      - name: Test unavailable new-subscription source and retained input offline
        run: node --test scripts/feed-add-ui.test.cjs scripts/subscription-tasks-ui.test.cjs scripts/subscription-dialog-layout.test.cjs
      - name: Test Xiaohongshu batch completion and download failure states offline
        run: node --test scripts/xiaohongshu-refresh-ui.test.cjs
      - name: Test closed Sites metadata contract offline
        run: node --test scripts/sites-local-contract.test.mjs
      - name: Test Server
        run: pnpm --filter server exec jest --runInBand
      - name: Test independent media reconciliation and global stop offline
        run: node --test scripts/offline-media-recovery.test.cjs
      - name: Test single-article official verification UI offline
        run: node --test scripts/acceptance-article-verification.test.cjs
      - name: Test retained article path recovery offline
        run: node --test scripts/browser-article-path-recovery.test.cjs
      - name: Test article layout repair and original-file preservation offline
        run: node --test scripts/repair-article-layout.test.cjs
      - name: Test feed view invalidation with installed tRPC batch link offline
        run: node --test scripts/refresh-feed-view.test.cjs scripts/feed-refresh-state-ui.test.cjs scripts/manual-refresh-progress-ui.test.cjs scripts/feed-avatar-reading-ui.test.cjs
      - name: Test local cache revision and diagnostic state offline
        run: node --test scripts/cache-revision-watch.test.cjs scripts/cache-sync-status-ui.test.cjs
      - name: Test periodic SQLite snapshots and fail-closed leases offline
        run: python3 apps/server/scripts/test_sqlite_snapshot_guard.py -v
      - name: Test bounded consistent backups with real synthetic concurrent writers
        run: python3 apps/server/scripts/test_backup_sqlite.py -v
      - name: Test cache-only Unicode transport and publisher identity offline
        run: python3 apps/server/scripts/test_read-wechat2rss-cache.py
      - name: Test read-only SQLite cache signals on synthetic databases
        run: python3 apps/server/scripts/test-watch-wechat2rss-cache.py
      - name: Test isolated WeRead gateway probe
        run: node --test scripts/probe-weread-gateway.test.cjs
      - name: Test isolated owner SDK handoff and resolver (no real HTTP)
        run: node --test scripts/research/owner-sdk-login-once.spec.cjs scripts/research/probe-owner-review-once.spec.cjs
      - name: Test storyfeed discovery probe offline
        run: node --test scripts/research/discovery-eink-storyfeed.test.cjs
      - name: Test native subscribed MP and review probes offline
        run: node --test scripts/research/probe-subscribed-mp-once.spec.cjs scripts/research/probe-native-review-owner07.spec.cjs
      - name: Test official album runtime scheduling policy
        run: node --test scripts/local-release/engine-audit.test.cjs scripts/local-release/sqlite-concurrency.test.cjs scripts/local-release/runtime-policy.test.cjs scripts/local-release/readiness.test.cjs scripts/local-release/launch.test.cjs scripts/local-release/startup-acceptance.test.cjs
      - name: Test desktop dependency startup and launch locking offline
        run: node --test scripts/local-release/desktop-dependencies.test.cjs scripts/local-release/desktop-progress.test.cjs scripts/local-release/desktop-home-entry.test.cjs
      - name: Test startup schema checks and exact database preservation
        run: |
          python3 scripts/local-release/test_inspect_sqlite.py
          python3 scripts/local-release/test_prepare_start.py
      - name: Test standalone dependency closure
        run: node --test scripts/local-release/dependency-closure.test.cjs
      - name: Test compact dependency bundle and native boundary offline
        run: node --test scripts/local-release/compact.test.cjs
      - name: Build Server
        run: pnpm --filter server build

      - name: Test browser DOM image collector offline
        run: node --test scripts/research/collect-browser-dom-images-once.spec.cjs
      - name: Test official MP chapters list and manual verification offline
        run: node --test scripts/research/serve-owner-manual-verify.spec.cjs scripts/research/probe-mp-chapters-once.spec.cjs scripts/research/probe-mp-chapters-verified-once.spec.cjs

  image-import-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Test fixed Node SQLite startup checks against Python offline
        run: node --test scripts/local-release/startup-sqlite.test.cjs scripts/local-release/startup-audit.test.cjs
      - name: Build Server
        run: pnpm --filter server build
      - name: Test image replay and one-article import offline
        run: node --test scripts/research/replay-browser-dom-images-copy.spec.cjs scripts/research/commit-browser-dom-images-once.spec.cjs

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone public album deployment
        env:
          AUTH_CODE: ci-public-album-config-validation
          SERVER_ORIGIN_URL: https://private.example.invalid
        run: |
          bash -n scripts/private-online/deploy-public-album.sh
          docker compose --env-file .env.public-album.example -f docker-compose.public-album.yml config --quiet
      - name: Build private online image
        run: docker build -f Dockerfile.private-online -t wewe-rss-private:ci .
