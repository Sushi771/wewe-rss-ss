name: CI

on:
  push:
    branches: [main, codex/main-delivered-media-ui-rss-20261018]
  pull_request:
    branches: [main, codex/experience-baseline-docs-20261020]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check README repository links
        run: node --test scripts/check-readme-links.test.cjs

      - name: Format check
        run: pnpm fmt.check

      - name: Lint Server
        run: pnpm --filter server lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Type check Web
        run: pnpm --filter web build
      - name: Test Server
        run: pnpm --filter server exec jest --runInBand
      - name: Test fresh and existing database schema compatibility offline
        run: node --test apps/server/scripts/test-main-schema-compatibility.cjs
      - name: Verify extracted runtime source boundaries
        run: node --test scripts/main-wechat-runtime-scope.test.cjs
      - name: Test extracted refresh UI and bounded list state offline
        run: node --test scripts/feed-refresh-state-ui.test.cjs scripts/manual-refresh-progress-ui.test.cjs scripts/feed-browse-state.test.cjs
      - name: Test actual article list over isolated authenticated HTTP
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
          ARTICLE_LIST_BROWSER_SAMPLES: '1'
        run: node --test scripts/article-list-browser.test.cjs
      - name: Test local body search UI and snippet escaping
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test scripts/body-search-browser.test.cjs scripts/sqlite-statements.test.cjs
      - name: Test synthetic reading image and archive experience
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
          EXPERIENCE_SAMPLES: '1'
        run: node --test scripts/experience-baseline.test.cjs
      - name: Test delivered status and media UI offline
        run: node --test scripts/reading-transport.test.cjs scripts/reading-query-cache.test.cjs scripts/export-article-batches.test.cjs scripts/storage-status-ui.test.cjs scripts/cache-sync-status-ui.test.cjs scripts/local-release/space-budget.test.cjs
      - name: Test delivered reading and automatic media components in a browser
        env:
          LAYOUT_TEST_BROWSER: /usr/bin/google-chrome
        run: node --test scripts/reading-status-browser.test.cjs scripts/automatic-media-status-browser.test.cjs
      - name: Test isolated WeRead gateway probe
        run: node --test scripts/probe-weread-gateway.test.cjs
      - name: Test isolated owner SDK handoff and resolver (no real HTTP)
        run: node --test scripts/research/owner-sdk-login-once.spec.cjs scripts/research/probe-owner-review-once.spec.cjs
      - name: Test storyfeed discovery probe offline
        run: node --test scripts/research/discovery-eink-storyfeed.test.cjs
      - name: Test native subscribed MP and review probes offline
        run: node --test scripts/research/probe-subscribed-mp-once.spec.cjs scripts/research/probe-native-review-owner07.spec.cjs
      - name: Test official album runtime scheduling policy
        run: node --test scripts/local-release/runtime-policy.test.cjs scripts/local-release/readiness.test.cjs
      - name: Test standalone dependency closure
        run: node --test scripts/local-release/dependency-closure.test.cjs
      - name: Build Server
        run: pnpm --filter server build

      - name: Test browser DOM image collector offline
        run: node --test scripts/research/collect-browser-dom-images-once.spec.cjs
      - name: Test official MP chapters list and manual verification offline
        run: node --test scripts/research/serve-owner-manual-verify.spec.cjs scripts/research/probe-mp-chapters-once.spec.cjs scripts/research/probe-mp-chapters-verified-once.spec.cjs

  image-import-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build Server
        run: pnpm --filter server build
      - name: Test image replay and one-article import offline
        run: node --test scripts/research/replay-browser-dom-images-copy.spec.cjs scripts/research/replay-weread-directory-copy.spec.cjs scripts/research/commit-browser-dom-images-once.spec.cjs

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone public album deployment
        env:
          AUTH_CODE: ci-public-album-config-validation
          SERVER_ORIGIN_URL: https://private.example.invalid
        run: |
          bash -n scripts/private-online/deploy-public-album.sh
          docker compose --env-file .env.public-album.example -f docker-compose.public-album.yml config --quiet
      - name: Build private online image
        run: docker build -f Dockerfile.private-online -t wewe-rss-private:ci .

  windows-backup-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Windows lifecycle and exact retirement protection on temporary databases
        working-directory: apps/server/scripts
        run: python -m unittest test_periodic_lifecycle test_backup_sqlite test_backup_space test_space_guard_compat test_sqlite_snapshot_guard test_sqlite_retention_plan

  cache-reconcile-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test cache flags and reconciliation on owned SQLite
        run: pnpm --filter server exec jest --runInBand src/feeds/cache-body-media-flags.spec.ts src/feeds/cache-sync-engine.spec.ts src/feeds/cache-sync-storage.spec.ts
      - name: Verify server types without changing admission policy
        run: pnpm --filter server exec tsc --noEmit --incremental false
      - name: Compare pinned and current schedulers with frozen legacy SQL
        run: node apps/server/scripts/benchmark-cache-reconcile.cjs "$RUNNER_TEMP" > cache-reconcile-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: cache-reconcile-benchmark
          path: cache-reconcile-benchmark.json
