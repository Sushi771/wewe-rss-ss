name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm fmt.check

      - name: Lint Server
        run: pnpm --filter server lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Type check Web
        run: pnpm --filter web build
      - name: Test Server
        run: pnpm --filter server test --runInBand
      - name: Build Server
        run: pnpm --filter server build

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build private online image
        run: docker build -f Dockerfile.private-online -t wewe-rss-private:ci .
