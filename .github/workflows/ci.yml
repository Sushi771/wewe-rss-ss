name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/manual-refresh-download-integration]

jobs:
  windows-process-identity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native loopback listener ownership and guarded stop
        run: node --test scripts/local-release/process-identity.test.cjs scripts/local-release/launch.test.cjs

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm fmt.check

      - name: Lint Server
        run: pnpm --filter server lint

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Type check Web
        run: pnpm --filter web build
      - name: Test Server
        run: pnpm --filter server exec jest --runInBand
      - name: Test isolated WeRead gateway probe
        run: node --test scripts/probe-weread-gateway.test.cjs
      - name: Test isolated owner SDK handoff and resolver (no real HTTP)
        run: node --test scripts/research/owner-sdk-login-once.spec.cjs scripts/research/probe-owner-review-once.spec.cjs
      - name: Test storyfeed discovery probe offline
        run: node --test scripts/research/discovery-eink-storyfeed.test.cjs
      - name: Test native subscribed MP and review probes offline
        run: node --test scripts/research/probe-subscribed-mp-once.spec.cjs scripts/research/probe-native-review-owner07.spec.cjs
      - name: Test official album runtime scheduling policy
        run: node --test scripts/local-release/runtime-policy.test.cjs scripts/local-release/readiness.test.cjs scripts/local-release/launch.test.cjs
      - name: Test standalone dependency closure
        run: node --test scripts/local-release/dependency-closure.test.cjs
      - name: Build Server
        run: pnpm --filter server build

      - name: Test browser DOM image collector offline
        run: node --test scripts/research/collect-browser-dom-images-once.spec.cjs
      - name: Test official MP chapters list and manual verification offline
        run: node --test scripts/research/serve-owner-manual-verify.spec.cjs scripts/research/probe-mp-chapters-once.spec.cjs scripts/research/probe-mp-chapters-verified-once.spec.cjs

  image-import-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build Server
        run: pnpm --filter server build
      - name: Test image replay and one-article import offline
        run: node --test scripts/research/replay-browser-dom-images-copy.spec.cjs scripts/research/commit-browser-dom-images-once.spec.cjs

  private-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone public album deployment
        env:
          AUTH_CODE: ci-public-album-config-validation
          SERVER_ORIGIN_URL: https://private.example.invalid
        run: |
          bash -n scripts/private-online/deploy-public-album.sh
          docker compose --env-file .env.public-album.example -f docker-compose.public-album.yml config --quiet
      - name: Build private online image
        run: docker build -f Dockerfile.private-online -t wewe-rss-private:ci .
